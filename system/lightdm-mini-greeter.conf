# /etc/lightdm/lightdm-mini-greeter.conf

[greeter]
user = tim
show-password-label = true
password-label-text = Password:
invalid-password-text = Invalid Password
show-input-cursor = true
password-alignment = center
show-image-on-all-monitors = false

[greeter-hotkeys]
mod-key = meta
shutdown-key = s
restart-key = r
hibernate-key = h
suspend-key = u

[greeter-theme]
font = "JetBrains Mono"
font-size = 1.2em
text-color = "#C5C8C6"
error-color = "#A54242"
background-image = "/var/cache/greeter-bg/current.png"
background-color = "#282A2E"
window-color = "#373B41"
border-color = "#27A1B9"
border-width = 2px
layout-space = 15
password-color = "#C5C8C6"
password-background-color = "#282A2E"
password-border-color = "#27A1B9"
password-border-width = 2px
password-border-radius = 10px
